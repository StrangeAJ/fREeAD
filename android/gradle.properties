org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Fix for Windows usernames with spaces
org.gradle.user.home=C:/gradle-home
android.builder.sdkDownload=true

# Force gradle to use safe temp directory.
#
# -Djdk.net.unixdomain.tmpdir: this profile's TEMP is the 8.3 short path
# C:\Users\ASHISH~1\AppData\Local\Temp (Windows shortens it because the user
# name contains a space). Java 21+ opens NIO selectors over an AF_UNIX socket
# placed in that directory, and Windows' AF_UNIX connect() rejects 8.3 paths
# with "Invalid argument", so every Gradle build dies with
# "java.io.IOException: Unable to establish loopback connection". Pointing the
# JDK at a plain path fixes it. The directory must exist.
# The Gradle *launcher* JVM does not read this file - export
# GRADLE_OPTS=-Djdk.net.unixdomain.tmpdir=C:/gradle-home/tmp (or set
# JAVA_TOOL_OPTIONS to the same) before running flutter build on this machine.
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djdk.net.unixdomain.tmpdir=C:/gradle-home/tmp
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Disable Kotlin incremental compilation to fix cross-drive path issues (pub cache on C: vs project on F:)
kotlin.incremental=false
