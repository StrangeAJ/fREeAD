name: freead
description: "FreeAd - a fast, private RSS reader with AI reading tools"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 3.0.0+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Cupertino icons
  cupertino_icons: ^1.0.8

  # HTTP client for API calls / feed + article fetching
  dio: ^5.7.0

  # XML parsing for RSS feeds
  xml: ^6.5.0

  # Image caching
  cached_network_image: ^3.4.1

  # Local database
  sqflite: ^2.4.0

  # SQLite FFI for desktop platforms
  sqflite_common_ffi: ^2.3.4

  # State management
  provider: ^6.1.2

  # URL launcher
  url_launcher: ^6.3.1

  # Date formatting
  intl: ^0.19.0

  # HTML parsing for article content
  html: ^0.15.4

  # Native HTML rendering in the reader
  flutter_widget_from_html_core: ^0.16.0

  # Headless WebView for JS-rendered pages (Readability.js)
  flutter_inappwebview: ^6.1.5

  # Material You dynamic colour on Android 12+.
  # Pinned: 1.8.0+ ship an android/build.gradle.kts that uses a bare
  # `kotlin { compilerOptions { ... } }` block, which needs AGP's built-in
  # Kotlin support (`android.builtInKotlin=true`, AGP 8.10+). This project is on
  # AGP 8.7.3 with `android.builtInKotlin=false`, so those versions fail to
  # configure. Unpin once the Android toolchain is upgraded.
  dynamic_color: 1.7.0

  # App version / build info for the About screen
  package_info_plus: ^8.1.2

  # Markdown -> HTML for AI answers
  markdown: ^7.3.0

  # Shared preferences for settings
  shared_preferences: ^2.3.2

  # Path utilities
  path: ^1.9.1

  # File picker for OPML import
  file_picker: ^8.1.4

  # Share functionality
  share_plus: ^10.1.1

  # Secure storage for API keys
  flutter_secure_storage: ^10.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Launcher icon generation
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0B0C0E"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 26
  remove_alpha_ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/js/Readability.js
    - assets/icon/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Literata
      fonts:
        - asset: assets/fonts/Literata-Regular.ttf
          weight: 400
        - asset: assets/fonts/Literata-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Literata-Medium.ttf
          weight: 500
        - asset: assets/fonts/Literata-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Literata-Bold.ttf
          weight: 700
